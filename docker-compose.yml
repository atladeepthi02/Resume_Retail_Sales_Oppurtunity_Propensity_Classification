version: '3.9'
services:
  api:
    build: .
    ports:
      - '8000:8000'
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MODEL_DIR=backend/models
    volumes:
      - .:/app
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retail_sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
